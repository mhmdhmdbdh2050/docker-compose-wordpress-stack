name: wordpress-compose-project

services:

  mariadb:
    image: mariadb:11
    container_name: mariadb

    restart: unless-stopped

    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      TZ: ${TZ}

    healthcheck:
      test:
        [
          "CMD",
          "healthcheck.sh",
          "--connect",
          "--innodb_initialized"
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

    volumes:
      - db_data:/var/lib/mysql

    networks:
      - wordpress-network


  wordpress:
    build:
      context: ./wordpress
      dockerfile: Dockerfile

    container_name: wordpress

    restart: unless-stopped

    depends_on:
      mariadb:
        condition: service_healthy

    environment:
      WORDPRESS_DB_HOST: mariadb:3306
      WORDPRESS_DB_NAME: ${MYSQL_DATABASE}
      WORDPRESS_DB_USER: ${MYSQL_USER}
      WORDPRESS_DB_PASSWORD: ${MYSQL_PASSWORD}
      TZ: ${TZ}

    volumes:
      - wordpress_data:/var/www/html
      - ./uploads:/var/www/html/wp-content/uploads

    networks:
      - wordpress-network


  nginx:
    build:
      context: ./nginx
      dockerfile: Dockerfile

    container_name: nginx

    restart: unless-stopped

    depends_on:
      wordpress:
        condition: service_started

    ports:
      - "8089:80"

    volumes:
      - wordpress_data:/var/www/html

    networks:
      - wordpress-network


  phpmyadmin:
    image: phpmyadmin:5.2
    container_name: phpmyadmin

    restart: unless-stopped

    depends_on:
      mariadb:
        condition: service_healthy

    environment:
      PMA_HOST: mariadb
      PMA_PORT: 3306

    ports:
      - "8081:80"

    networks:
      - wordpress-network


networks:
  wordpress-network:
    driver: bridge


volumes:
  db_data:
  wordpress_data:
