name: wordpress-compose-project
services:
  mariadb:
    container_name: mariadb
    environment:
      MYSQL_DATABASE: wordpress
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?Set MYSQL_PASSWORD in .env}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Set MYSQL_ROOT_PASSWORD in .env}
      MYSQL_USER: wpuser
      PMA_HOST: mariadb
      PMA_PORT: "3306"
      TZ: Africa/Cairo
      WORDPRESS_DB_HOST: mariadb:3306
      WORDPRESS_DB_NAME: wordpress
      WORDPRESS_DB_PASSWORD: ${MYSQL_PASSWORD:?Set MYSQL_PASSWORD in .env}
      WORDPRESS_DB_USER: wpuser
    healthcheck:
      test:
        - CMD
        - healthcheck.sh
        - --connect
        - --innodb_initialized
      timeout: 5s
      interval: 10s
      retries: 5
      start_period: 30s
    image: mariadb:11
    networks:
      wordpress-network: null
    restart: unless-stopped
    volumes:
      - type: volume
        source: db_data
        target: /var/lib/mysql
        volume: {}
  nginx:
    build:
      context: C:\Users\Z BOOK G3\wordpress-compose-project\nginx
      dockerfile: Dockerfile
    container_name: nginx
    depends_on:
      wordpress:
        condition: service_started
        required: true
    networks:
      wordpress-network: null
    ports:
      - mode: ingress
        target: 80
        published: "8080"
        protocol: tcp
    restart: unless-stopped
    volumes:
      - type: volume
        source: wordpress_data
        target: /var/www/html
        volume: {}
  phpmyadmin:
    container_name: phpmyadmin
    depends_on:
      mariadb:
        condition: service_healthy
        required: true
    environment:
      PMA_HOST: mariadb
      PMA_PORT: "3306"
    image: phpmyadmin:latest
    networks:
      wordpress-network: null
    ports:
      - mode: ingress
        target: 80
        published: "8081"
        protocol: tcp
    restart: unless-stopped
  wordpress:
    build:
      context: C:\Users\Z BOOK G3\wordpress-compose-project\wordpress
      dockerfile: Dockerfile
    container_name: wordpress
    depends_on:
      mariadb:
        condition: service_healthy
        required: true
    environment:
      MYSQL_DATABASE: wordpress
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?Set MYSQL_PASSWORD in .env}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Set MYSQL_ROOT_PASSWORD in .env}
      MYSQL_USER: wpuser
      PMA_HOST: mariadb
      PMA_PORT: "3306"
      TZ: Africa/Cairo
      WORDPRESS_DB_HOST: mariadb:3306
      WORDPRESS_DB_NAME: wordpress
      WORDPRESS_DB_PASSWORD: ${MYSQL_PASSWORD:?Set MYSQL_PASSWORD in .env}
      WORDPRESS_DB_USER: wpuser
    networks:
      wordpress-network: null
    restart: unless-stopped
    volumes:
      - type: volume
        source: wordpress_data
        target: /var/www/html
        volume: {}
      - type: bind
        source: C:\Users\Z BOOK G3\wordpress-compose-project\uploads
        target: /var/www/html/wp-content/uploads
        bind: {}
networks:
  wordpress-network:
    name: wordpress-compose-project_wordpress-network
    driver: bridge
volumes:
  db_data:
    name: wordpress-compose-project_db_data
  wordpress_data:
    name: wordpress-compose-project_wordpress_data
